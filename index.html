<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Operaciones con JavaScript</title>
	<link rel="stylesheet" href="estilos.css">
	<script type="text/javascript" src="operaciones.js" defer></script>
</head>
<body>
	<div class="container">
		<h1>Calculadora de Operaciones</h1>
		<form>
			<label for="num1">Primer número</label>
			<input type="text" id="num1" placeholder="Escribe un número">

			<label for="num2">Segundo número</label>
			<input type="text" id="num2" placeholder="Escribe un número">

			<div class="buttons">
				<input type="button" value="Suma" onclick="sumar()">
				<input type="button" value="Resta" onclick="restar()">
				<input type="button" value="Multiplicar" onclick="multiplicar()">
				<input type="button" value="Dividir" onclick="dividir()">
			</div>
		</form>

		<p class="resultado">Resultado: <span id="r"></span></p>
	</div>
</body>
</html>
